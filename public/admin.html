<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>品牌審核後台｜光緣</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="brand" href="/">✦ <span>光緣 <small>GUANGYUAN LIFE</small></span></a><nav><a href="/">返回首頁</a></nav></header><main class="form-page"><span class="eyebrow">PRIVATE ADMIN</span><h1>品牌審核管理</h1><section id="loginPanel" class="form-card"><form id="login"><label class="field">管理密碼<input type="password" name="password" autocomplete="current-password" required></label><button class="submit">登入管理</button></form><p class="note">管理密碼必須先設定在 Cloudflare 環境 Secret，不可寫入 GitHub。</p></section><section id="adminPanel" class="hidden"><div class="searchrow"><select id="filter"><option value="all">全部申請</option><option value="pending">待審核</option><option value="published">已上架</option><option value="rejected">未通過</option></select><button id="logout" class="cat">登出</button></div><p class="note">核准後立即進入公開品牌目錄，請先檢查資訊與圖文使用授權。</p><div id="adminList" class="admin-grid"></div></section><p id="status" role="status" class="notice hidden"></p></main><script type="module" src="/admin.js"></script></body></html>
