<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>申請加入｜光緣共好生活聚落</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="brand" href="/">✦ <span>光緣 <small>GUANGYUAN LIFE</small></span></a><nav><a href="/">← 返回首頁</a></nav></header><main class="form-page"><span class="eyebrow">JOIN OUR COMMUNITY</span><h1>讓更多人看見你的品牌</h1><p class="intro">歡迎店家、專業服務者與獨立品牌提出申請。光緣將審核品牌資訊後決定是否刊登。本站不代替合作品牌收款、出貨或管理訂單。</p><form id="application" class="form-card"><div class="form-grid"><label class="field">品牌名稱 *<input name="name" maxlength="90" required></label><label class="field">主要分類 *<select name="category" required><option value="">請選擇</option><option>美食</option><option>穿搭</option><option>居家</option><option>交通</option><option>學習</option><option>休閒</option><option>購物</option><option>服務</option></select></label><label class="field">縣市 *<input name="city" placeholder="例：嘉義市" maxlength="40" required></label><label class="field">區域／鄉鎮<input name="district" placeholder="例：西區" maxlength="40"></label><label class="field full">品牌介紹 *<textarea name="description" minlength="15" maxlength="1200" required placeholder="請用至少 15 字介紹品牌特色、理念與適合的服務對象"></textarea></label><label class="field full">主要商品／服務項目<input name="services" maxlength="400" placeholder="例：美睫、睫毛管理、預約服務"></label><label class="field full">封面照片網址（請使用已授權的 https 圖片連結）<input name="cover_url" type="url" placeholder="https://..."></label><label class="field">官方網站網址<input name="website" type="url" placeholder="https://..."></label><label class="field">Instagram 完整網址<input name="instagram" type="url" placeholder="https://instagram.com/..."></label><label class="field">官方 LINE 完整網址<input name="line_url" type="url" placeholder="https://lin.ee/..."></label><label class="field">公開聯絡電話<input name="phone" type="tel" maxlength="35"></label><label class="field full">公開地址（選填）<input name="address" maxlength="180"></label><label class="field">申請聯絡人 *<input name="contact_name" maxlength="60" required><small>僅供管理者聯絡，不公開</small></label><label class="field">聯絡信箱 *<input name="contact_email" type="email" maxlength="150" required><small>僅供審核及資料更新聯絡，不公開</small></label></div><div style="position:absolute;left:-99999px" aria-hidden="true"><label>網站<input name="honeypot" tabindex="-1" autocomplete="off"></label></div><p class="note">需提供至少一項官方聯絡方式（網站、Instagram、LINE 或電話）。</p><label class="note"><input type="checkbox" name="consent" required> 我同意光緣為審核、刊登及聯絡目的蒐集上述資料，確認擁有文字與圖片之使用授權，並已閱讀<a href="/privacy.html" target="_blank" style="text-decoration:underline">隱私與刊登說明</a>。</label><div id="turnstileBox" class="field full" aria-label="人機驗證"></div><button class="submit" id="send">送出品牌刊登申請 ↗</button><div id="message" role="status" aria-live="polite"></div></form></main><script type="module">const f=document.querySelector('#application'),msg=document.querySelector('#message'),btn=document.querySelector('#send');f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;btn.textContent='送出中…';const data=Object.fromEntries(new FormData(f));data.turnstileToken=window.turnstile?.getResponse?.()||"";data.consent=!!f.elements.consent.checked;try{const r=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw Error(x.error||'送出失敗');msg.className='notice';msg.textContent='申請已成功送出！審核完成後，店家資訊才會公開上架。';f.reset();window.turnstile?.reset?.()}catch(err){msg.className='notice';msg.textContent=err.message;window.turnstile?.reset?.()}finally{btn.disabled=false;btn.textContent='送出品牌刊登申請 ↗'}};</script><script type="module" src="/turnstile-init.js"></script></body></html>
